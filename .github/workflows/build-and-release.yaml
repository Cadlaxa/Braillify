name: Cross-Platform Build and Release

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Package pre-compiled binary
  # ==========================================
  build:
    name: Package Pre-Compiled Binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Version from braillify.ino
      id: get_version
      run: |
        # Read the #define FIRMWARE_VERSION line from braillify.ino
        VERSION=$(grep -E '#define +FIRMWARE_VERSION' braillify/braillify.ino | sed -E 's/.*"([^"]+)".*/\1/')
        echo "FIRMWARE_VER=$VERSION" >> $GITHUB_ENV
        echo "Extracted Firmware Version: $VERSION"

    - name: Prepare Firmware Artifacts
      run: |
        mkdir -p ./publish_output
        cp braillify/build/esp32.esp32.esp32/braillify.ino.bin ./publish_output/firmware.bin
        cp braillify/build/esp32.esp32.esp32/braillify.ino.bin ./publish_output/braillify-v${{ env.FIRMWARE_VER }}.bin

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-binaries
        path: ./publish_output/*

  # ==========================================
  # JOB 2: Create the GitHub Release
  # ==========================================
  release:
    name: Publish to Releases Tab
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Version from braillify.ino
      run: |
        VERSION=$(grep -E '#define +FIRMWARE_VERSION' braillify/braillify.ino | sed -E 's/.*"([^"]+)".*/\1/')
        echo "FIRMWARE_VER=$VERSION" >> $GITHUB_ENV

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        name: firmware-binaries
        path: ./artifacts

    - name: Generate Update Manifest JSON
      run: |
        VERSION="${{ env.FIRMWARE_VER }}"
        PUBDATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        REPO_URL="https://github.com/${{ github.repository }}"
        DOWNLOAD_URL="$REPO_URL/releases/download/v$VERSION"

        cat <<EOF > ./artifacts/manifest.json
        {
          "version": "$VERSION",
          "releaseDate": "$PUBDATE",
          "firmwareUrl": "$DOWNLOAD_URL/firmware.bin",
          "versionedUrl": "$DOWNLOAD_URL/braillify-v$VERSION.bin"
        }
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.FIRMWARE_VER }}
        name: Braillify Firmware Release v${{ env.FIRMWARE_VER }}
        body: |
          🚀 Release for Braillify ESP32 Firmware v${{ env.FIRMWARE_VER }}.

          ### 📦 Artifacts Included
          * `firmware.bin` (Direct payload link for HTTP OTA updates)
          * `braillify-v${{ env.FIRMWARE_VER }}.bin` (Versioned firmware binary)
          * `manifest.json` (OTA metadata update manifest)

          ### 🔄 OTA Direct Download Link
          `https://github.com/${{ github.repository }}/releases/download/v${{ env.FIRMWARE_VER }}/firmware.bin`
        files: ./artifacts/*
        draft: false
        prerelease: false