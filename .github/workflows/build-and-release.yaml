name: Braillify Firmware Build and Release

on:
  # push:
  #   branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Compile the firmware for ESP32
  # ==========================================
  build:
    name: Build Braillify Firmware
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build ESP32 Firmware
      run: pio run

    - name: Prepare Firmware Artifacts
      run: |
        mkdir -p ./publish_output
        VERSION="1.0.${{ github.run_number }}"
        cp .pio/build/*/firmware.bin ./publish_output/firmware.bin
        cp .pio/build/*/firmware.bin ./publish_output/braillify-v${VERSION}.bin

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-binaries
        path: ./publish_output/*

  # ==========================================
  # JOB 2: Create the GitHub Release
  # ==========================================
  release:
    name: Publish to Releases Tab
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        name: firmware-binaries
        path: ./artifacts

    - name: Generate Update Manifest JSON
      run: |
        VERSION="1.0.${{ github.run_number }}"
        PUBDATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        REPO_URL="https://github.com/${{ github.repository }}"
        DOWNLOAD_URL="$REPO_URL/releases/download/v$VERSION"

        cat <<EOF > ./artifacts/manifest.json
        {
          "version": "$VERSION",
          "releaseDate": "$PUBDATE",
          "firmwareUrl": "$DOWNLOAD_URL/firmware.bin",
          "versionedUrl": "$DOWNLOAD_URL/braillify-v$VERSION.bin"
        }
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Braillify Firmware Release v1.0.${{ github.run_number }}
        body: |
          🚀 Automatically generated release for Braillify ESP32 Firmware v1.0.${{ github.run_number }}.

          ### 📦 Artifacts Included
          * `firmware.bin` (Direct payload link for HTTP OTA updates)
          * `braillify-v1.0.${{ github.run_number }}.bin` (Versioned firmware binary)
          * `manifest.json` (OTA metadata update manifest)

          ### 🔄 OTA Direct Download Link
          `https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/firmware.bin`
        files: ./artifacts/*
        draft: false
        prerelease: false